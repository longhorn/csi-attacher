name: Copy Build Workflow

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copy-build-workflow
  cancel-in-progress: false

jobs:
  find-branches:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.branches.outputs.branches }}
      has_branches: ${{ steps.branches.outputs.has_branches }}
    steps:
      - name: Checkout longhorn branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/longhorn

      - name: Find longhorn-* branches missing build.yml
        id: branches
        run: |
          if [[ ! -f .github/workflows/build.yml ]]; then
            echo ".github/workflows/build.yml not found on longhorn branch"
            exit 1
          fi

          git fetch --depth=1 origin 'refs/heads/longhorn-*:refs/remotes/origin/longhorn-*'

          missing_branches=()
          while IFS= read -r branch; do
            if [[ -z "${branch}" ]]; then
              continue
            fi
            if git cat-file -e "origin/${branch}:.github/workflows/build.yml" 2>/dev/null; then
              echo "Skipping ${branch}: .github/workflows/build.yml already exists."
              continue
            fi
            missing_branches+=("${branch}")
          done < <(git for-each-ref --format='%(refname:lstrip=3)' 'refs/remotes/origin/longhorn-*')

          if [[ "${#missing_branches[@]}" -eq 0 ]]; then
            echo "No longhorn-* branches missing build.yml."
            echo "branches=[]" >>"$GITHUB_OUTPUT"
            echo "has_branches=false" >>"$GITHUB_OUTPUT"
          else
            branches_json="$(jq -nc '$ARGS.positional' --args "${missing_branches[@]}")"
            echo "Target branches: ${branches_json}"
            echo "branches=${branches_json}" >>"$GITHUB_OUTPUT"
            echo "has_branches=true" >>"$GITHUB_OUTPUT"
          fi

  create-pull-request:
    needs: find-branches
    if: needs.find-branches.outputs.has_branches == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.find-branches.outputs.branches) }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.LONGHORN_GITHUB_BOT_APP_ID }}
          private-key: ${{ secrets.LONGHORN_GITHUB_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ matrix.branch }}
          persist-credentials: false

      - name: Copy build.yml from longhorn branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p .github/workflows
          gh api "/repos/${GITHUB_REPOSITORY}/contents/.github/workflows/build.yml?ref=longhorn" \
            -H "Accept: application/vnd.github.raw+json" > .github/workflows/build.yml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: ${{ matrix.branch }}
          branch: "chore/add-build-workflow-${{ matrix.branch }}"
          delete-branch: true
          sign-commits: true
          signoff: true
          author: Longhorn GitHub Bot <67932897+longhorn-io-github-bot@users.noreply.github.com>
          committer: Longhorn GitHub Bot <67932897+longhorn-io-github-bot@users.noreply.github.com>
          commit-message: "chore(workflow): add build.yml"
          title: "chore(workflow): add build.yml"
          body: |
            Copy `.github/workflows/build.yml` from `longhorn` branch to `${{ matrix.branch }}`.
